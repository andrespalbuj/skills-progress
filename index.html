<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      * {
        box-sizing: border-box;
      }
      .container{
        background-color: grey;
      }
     .skills{
      padding: 0.8rem;
      color: White;
      text-align: right;
     } 
     .html{
      background-color: green;
      width: 90%;
     }
     .css{
      background-color: blue;
      width: 80%;
     }
     .js{
      background-color: red;
      width: 65%;
     }
     .php{
      background-color: rgb(211, 179, 130);
      width: 60%;
     }
    </style>
  </head>

  <body>
    <h1>My Skills</h1>

    <p>HTML</p>
    <div class="container">
      <div class="skills html">90%</div>
    </div>

    <p>CSS</p>
    <div class="container">
      <div class="skills css">80%</div>
    </div>

    <p>JavaScript</p>
    <div class="container">
      <div class="skills js">65%</div>
    </div>

    <p>PHP</p>
    <div class="container">
      <div class="skills php">60%</div>
    </div>
  </body>
</html>
